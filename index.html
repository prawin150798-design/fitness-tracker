<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="Personal fitness tracker with Google Sheets sync, adaptive workouts, body metrics, habits and food tracking.">
<link rel="manifest" href="manifest.json">
<title>Fitness Tracker</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#697386;--line:#e5e9f0;--accent:#2563eb;--accent2:#1d4ed8;--good:#16803c;--warn:#a16207;--bad:#b42318;--shadow:0 8px 24px rgba(17,24,39,.06);--radius:16px}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding-bottom:110px}.wrap{max-width:1120px;margin:auto;padding:16px}
header{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.head{max-width:1120px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:800;font-size:20px}.sub{font-size:12px;color:var(--muted);margin-top:2px}
button,input,select,textarea{font:inherit}button{border:0;border-radius:11px;padding:10px 14px;cursor:pointer;font-weight:700}
.btn{background:var(--accent);color:#fff}.btn:hover{background:var(--accent2)}.btn.secondary{background:#eef2f7;color:var(--text)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}.btn.danger{background:#fee4e2;color:var(--bad)}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:#9ca3af}.dot.ok{background:#16a34a}.dot.busy{background:#f59e0b}
nav{display:flex;gap:7px;overflow:auto;padding:10px 0 2px}.tab{white-space:nowrap;background:#eef2f7;color:#4b5563}.tab.active{background:var(--accent);color:#fff}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
h1,h2,h3{margin:0 0 8px}h1{font-size:25px}h2{font-size:18px}h3{font-size:15px}.muted{color:var(--muted)}.small{font-size:12px}.big{font-size:28px;font-weight:800}
.kpi{min-height:112px}.kpi .label{font-size:12px;color:var(--muted)}.kpi .value{margin-top:8px}.kpi .delta{font-size:12px;margin-top:6px}
section{display:none}section.active{display:block}.section-head{display:flex;justify-content:space-between;gap:10px;align-items:end;margin:16px 0 12px}
.form{display:grid;gap:10px}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
label{font-size:12px;font-weight:700;color:#4b5563;display:block;margin-bottom:5px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.08)}
textarea{min-height:70px;resize:vertical}.actions{display:flex;flex-wrap:wrap;gap:8px}.right{display:flex;justify-content:flex-end}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:11px;text-transform:uppercase;color:var(--muted)}
.table-wrap{overflow:auto}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:700}
.notice{padding:11px 12px;border-radius:11px;background:#eff6ff;color:#1e40af;font-size:13px}.success{background:#ecfdf3;color:#166534}.warning{background:#fffbeb;color:#92400e}.error{background:#fef2f2;color:#991b1b}
.exercise{border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px}.exercise-top{display:flex;justify-content:space-between;gap:10px}.exercise-name{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:3px}.sets{margin-top:10px}
.setrow{display:grid;grid-template-columns:34px 1fr 1fr 1fr 36px 36px;gap:7px;align-items:center;margin-bottom:7px}.setno{font-size:12px;color:var(--muted);font-weight:700}.setrow input{padding:8px}.setrow .btn{padding:8px 0;width:100%}
canvas{width:100%;height:210px;display:block}.chartbox{height:235px}
footer{max-width:1120px;margin:20px auto;color:var(--muted);font-size:11px;padding:0 16px;text-align:center}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
#restBar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#111827;color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(0,0,0,.25)}
#restBar.on{display:block}#restBar.done{background:#15803d}
.restin{max-width:1120px;margin:auto;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
#restTime{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;min-width:90px}#restLabel{font-size:12px;opacity:.8}
